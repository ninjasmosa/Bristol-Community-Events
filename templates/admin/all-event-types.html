{% extends 'base.html' %}

{% block title %}
    All event types - Bristol Community Events
{% endblock %}

{% block content %}
<section class="container-fluid">
    <h1>All Event Types</h1>
    <table class="table">
        <thead>
            <tr>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            {% for event_type in event_types %}
            <tr>
                <td>{{ event_type[0] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
